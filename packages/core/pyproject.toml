[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rxdjango"
version = "0.1.0"
description = "Django-React real-time state synchronization via WebSockets"
readme = "README.md"
license = { file = "LICENSE.md" }
authors = [
    { name = "Luis Fagundes", email = "lhfagundes@gmail.com" },
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    "Django>=4.2",
    "channels>=4",
]

[project.urls]
Homepage = "https://github.com/rxdjango/rxdjango"
Repository = "https://github.com/rxdjango/rxdjango"

[tool.hatch.build.targets.wheel]
packages = ["src/rxdjango"]

[tool.hatch.build.targets.sdist]
include = [
    "src/rxdjango",
    "README.md",
    "LICENSE.md",
]
