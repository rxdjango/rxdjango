[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rxdjango-model"
version = "0.1.0"
description = "Django model state synchronization for RxDjango"
readme = "README.md"
license = { file = "LICENSE.md" }
authors = [
    { name = "Luis Fagundes", email = "lhfagundes@gmail.com" },
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    "djangorestframework>=3",
    "channels-redis>=4.1",
]

[project.urls]
Homepage = "https://github.com/rxdjango/rxdjango"
Repository = "https://github.com/rxdjango/rxdjango"

[tool.hatch.build.targets.wheel]
packages = ["src/rxdjango_model"]

[tool.hatch.build.targets.sdist]
include = [
    "src/rxdjango_model",
    "README.md",
    "LICENSE.md",
]
